[project]
name = "eval-triage"
version = "0.1.0"
description = "Triage Inspect AI .eval logs by monitor suspicion score."
requires-python = ">=3.11"
dependencies = ["inspect-ai>=0.3.252", "rich>=13.7.0"]

[project.scripts]
eval-triage = "eval_triage.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
